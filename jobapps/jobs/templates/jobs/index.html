<!DOCTYPE html>
<html>
<head>
    <title>Job Postings</title>
</head>

<body>
    <div class="p-3">
        <div class="container">
            <div class="row mt-3">
                <div class="col mx-auto mb-3">
                    <h2>Job Postings</h2>
                    <hr />
                </div>
            </div>

            <div class="row">
                {% for job in template_data.jobs %}
                <div class="col-md-4 col-lg-3 mb-3">
                    <div class="card p-3 h-100">
                        <div class="card-body">

                            <h5 class="card-title">
                                {{ job.title }}
                            </h5>

                            <p>
                                <b>Company:</b>
                                {{ job.company }}
                            </p>

                            <p>
                                <b>Location:</b>
                                {{ job.location }}
                            </p>

                            <a href="{% url 'jobs.show' id=job.id %}">
                                View Job
                            </a>

                        </div>
                    </div>
                </div>

                {% empty %}
                <p>No job postings available.</p>

                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
