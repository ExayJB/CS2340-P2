<!DOCTYPE html>
<html>
<head>
    <title>Saved Jobs</title>
</head>

<body>

    <h2>Saved Jobs</h2>

    {% for job in template_data.jobs_in_cart %}

        <div>
            <h3>{{ job.title }}</h3>

            <p>
                <b>Company:</b>
                {{ job.company }}
            </p>

            <p>
                <b>Location:</b>
                {{ job.location }}
            </p>

            <!-- Opens the full page for this job -->
            <a href="{% url 'jobs.show' id=job.id %}">
                View Job
            </a>

            <br />
            <br />

            <!-- Removes only this specific job from the cart -->
            <a href="{% url 'cart.remove' id=job.id %}">
                <button type="button">
                    Remove from Cart
                </button>
            </a>

            <hr />
        </div>

    {% empty %}

        <p>Your cart is empty.</p>

    {% endfor %}


    <!-- Only show this button when there is at least one saved job -->
    {% if template_data.jobs_in_cart|length > 0 %}

        <a href="{% url 'cart.clear' %}">
            <button type="button">
                Remove All Jobs from Cart
            </button>
        </a>

        <br />
        <br />

    {% endif %}


    <a href="{% url 'jobs.index' %}">
        Browse Jobs
    </a>

</body>
</html>
