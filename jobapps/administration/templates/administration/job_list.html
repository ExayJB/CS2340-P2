<!DOCTYPE html>
<html>
<head>
    <title>Manage Job Posts</title>
</head>
<body>

    <h1>Manage Job Posts</h1>

    <table border="1">
        <tr>
            <th>Title</th>
            <th>Recruiter</th>
            <th>Location</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        {% for job in jobs %}
        <tr>
            <td>{{ job.title }}</td>
            <td>{{ job.recruiter.username }}</td>
            <td>{{ job.location }}</td>

            <td>
                {% if job.is_active %}
                    Active
                {% else %}
                    Removed
                {% endif %}
            </td>

            <td>
                <a href="{% url 'administration:job_detail' job.id %}">
                    Manage
                </a>
            </td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="5">
                No job posts found.
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>

    <a href="{% url 'administration:dashboard' %}">
        Back to Dashboard
    </a>

    <br><br>

    <a href="{% url 'administration:logout' %}">
        Logout
    </a>

</body>
</html>
