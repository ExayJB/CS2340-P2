{% extends 'admin_base.html' %}

{% block title %}
Administrator Login
{% endblock %}


{% block content %}

<section class="form-card card">

    <h1>Administrator Login</h1>


    {% if error %}

        <div class="alert danger-text">
            {{ error }}
        </div>

    {% endif %}


    <form method="post">

        {% csrf_token %}


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Login
        </button>

    </form>

</section>

{% endblock %}
