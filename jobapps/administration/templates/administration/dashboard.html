{% extends 'admin_base.html' %}

{% block title %}
Administrator Dashboard
{% endblock %}


{% block content %}

<div class="page-heading">

    <h1>Administrator Dashboard</h1>

    <p>
        Welcome, {{ request.user.username }}.
    </p>

</div>


<div class="admin-links">

    <a
        class="card"
        href="{% url 'administration:user_list' %}"
    >
        Manage Users
    </a>


    <a
        class="card"
        href="{% url 'administration:export_users_csv' %}"
    >
        Download User Usage Report (CSV)
    </a>


    <a
        class="card"
        href="{% url 'administration:job_list' %}"
    >
        Manage Job Posts
    </a>

</div>


<div class="actions">

    <a
        class="btn btn-secondary"
        href="{% url 'administration:logout' %}"
    >
        Logout
    </a>

</div>

{% endblock %}
