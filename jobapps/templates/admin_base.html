{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Admin | JobApps{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

<header class="site-header">

    <a
        class="brand"
        href="{% url 'administration:dashboard' %}"
    >
        JobApps Admin
    </a>

    <nav class="nav-links">

        {% if request.user.is_authenticated %}

            <a href="{% url 'administration:user_list' %}">
                Users
            </a>

            <a href="{% url 'administration:job_list' %}">
                Jobs
            </a>

            <a href="{% url 'administration:logout' %}">
                Log out
            </a>

        {% endif %}

    </nav>

</header>


<main class="page-shell">

    {% block content %}
    {% endblock %}

</main>


<footer class="site-footer">
    Administrator Console
</footer>

</body>
</html>
