{% extends 'base.html' %}

{% block title %}
Log In | JobApps
{% endblock %}


{% block content %}

<section class="form-card card">

    <div class="page-heading">
        <h1>Welcome back</h1>

        <p class="muted">
            Log in to manage your job search.
        </p>
    </div>


    {% if template_data.error %}
        <div class="alert danger-text">
            {{ template_data.error }}
        </div>
    {% endif %}


    <form method="post">

        {% csrf_token %}

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            class="btn btn-primary"
            type="submit"
        >
            Log in
        </button>

    </form>


    <p class="muted">
        New here?

        <a href="{% url 'accounts.signup' %}">
            Create an account
        </a>.
    </p>

</section>

{% endblock %}
