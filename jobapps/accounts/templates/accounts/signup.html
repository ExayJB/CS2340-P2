{% extends 'base.html' %}

{% block title %}
Sign Up | JobApps
{% endblock %}


{% block content %}

<section class="form-card card">

    <div class="page-heading">

        <h1>Create your account</h1>

        <p class="muted">
            Set up your JobApps profile.
        </p>

    </div>


    <form method="post">

        {% csrf_token %}

        {{ template_data.form.as_p }}

        <button
            class="btn btn-primary"
            type="submit"
        >
            Create account
        </button>

    </form>


    <p class="muted">

        Already have an account?

        <a href="{% url 'accounts.login' %}">
            Log in
        </a>.

    </p>

</section>

{% endblock %}
